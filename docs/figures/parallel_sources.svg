<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56796b"/></marker></defs><rect width="1100" height="640" fill="#f4f7f1"/><g font-family="Microsoft YaHei, sans-serif"><text x="50" y="43" font-size="27" font-weight="bold" fill="#163b31">并行的是起点循环，每个进程仍读取完整图</text><rect x="350" y="75" width="400" height="90" rx="12" fill="white" stroke="#bacfc1"/><text x="550.0" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#164b40">完整图 G + 全部起点</text><text x="550.0" y="132" text-anchor="middle" font-size="16" fill="#4e6659">按 B 分批；每个起点恰好一次</text><path d="M550 165 L190 243" stroke="#56796b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="45" y="245" width="290" height="150" rx="12" fill="white" stroke="#bacfc1"/><text x="190.0" y="274" text-anchor="middle" font-size="20" font-weight="bold" fill="#164b40">工作进程 0</text><text x="190.0" y="302" text-anchor="middle" font-size="16" fill="#4e6659">完整邻接表副本</text><text x="190.0" y="325" text-anchor="middle" font-size="16" fill="#4e6659">本进程负责的起点批次</text><text x="190.0" y="348" text-anchor="middle" font-size="16" fill="#4e6659">同一单源内核 → 局部向量</text><path d="M190 395 L550 473" stroke="#56796b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M550 165 L550 243" stroke="#56796b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="405" y="245" width="290" height="150" rx="12" fill="white" stroke="#bacfc1"/><text x="550.0" y="274" text-anchor="middle" font-size="20" font-weight="bold" fill="#164b40">工作进程 1</text><text x="550.0" y="302" text-anchor="middle" font-size="16" fill="#4e6659">完整邻接表副本</text><text x="550.0" y="325" text-anchor="middle" font-size="16" fill="#4e6659">不同的起点批次</text><text x="550.0" y="348" text-anchor="middle" font-size="16" fill="#4e6659">同一单源内核 → 局部向量</text><path d="M550 395 L550 473" stroke="#56796b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M550 165 L910 243" stroke="#56796b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="765" y="245" width="290" height="150" rx="12" fill="white" stroke="#bacfc1"/><text x="910.0" y="274" text-anchor="middle" font-size="20" font-weight="bold" fill="#164b40">工作进程 2</text><text x="910.0" y="302" text-anchor="middle" font-size="16" fill="#4e6659">完整邻接表副本</text><text x="910.0" y="325" text-anchor="middle" font-size="16" fill="#4e6659">不同的起点批次</text><text x="910.0" y="348" text-anchor="middle" font-size="16" fill="#4e6659">同一单源内核 → 局部向量</text><path d="M910 395 L550 473" stroke="#56796b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="275" y="475" width="550" height="105" rx="12" fill="white" stroke="#bacfc1"/><text x="550.0" y="504" text-anchor="middle" font-size="20" font-weight="bold" fill="#164b40">主进程归并</text><text x="550.0" y="532" text-anchor="middle" font-size="16" fill="#4e6659">每进程只回传一次长度 n 的总贡献向量</text><text x="550.0" y="555" text-anchor="middle" font-size="16" fill="#4e6659">统一 raw / 归一化 → 与串行相同的全图分数</text><text x="550" y="620" text-anchor="middle" font-size="17" fill="#4e6659">三进程仅作原理示意；实际进程数按配置、CPU与节点数限制。</text></g></svg>