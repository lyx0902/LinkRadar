<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56796b"/></marker></defs><rect width="1100" height="640" fill="#f4f7f1"/><g font-family="Microsoft YaHei, sans-serif"><text x="50" y="43" font-size="27" font-weight="bold" fill="#163b31">LinkRadar：从连接数据到可核验展示</text><rect x="45" y="85" width="290" height="135" rx="12" fill="white" stroke="#bacfc1"/><text x="190.0" y="114" text-anchor="middle" font-size="20" font-weight="bold" fill="#164b40">数据与清洗</text><text x="190.0" y="142" text-anchor="middle" font-size="16" fill="#4e6659">真实导入 / 合成图</text><text x="190.0" y="165" text-anchor="middle" font-size="16" fill="#4e6659">去自环、去重复、保留节点</text><rect x="405" y="85" width="290" height="135" rx="12" fill="white" stroke="#bacfc1"/><text x="550.0" y="114" text-anchor="middle" font-size="20" font-weight="bold" fill="#164b40">同一张完整图</text><text x="550.0" y="142" text-anchor="middle" font-size="16" fill="#4e6659">固定ID映射与邻接表</text><text x="550.0" y="165" text-anchor="middle" font-size="16" fill="#4e6659">记录来源与图指纹</text><rect x="765" y="85" width="290" height="135" rx="12" fill="white" stroke="#bacfc1"/><text x="910.0" y="114" text-anchor="middle" font-size="20" font-weight="bold" fill="#164b40">自写串并行Brandes</text><text x="910.0" y="142" text-anchor="middle" font-size="16" fill="#4e6659">单源内核相同</text><text x="910.0" y="165" text-anchor="middle" font-size="16" fill="#4e6659">并行分配不同起点</text><rect x="765" y="365" width="290" height="135" rx="12" fill="white" stroke="#bacfc1"/><text x="910.0" y="394" text-anchor="middle" font-size="20" font-weight="bold" fill="#164b40">正确性与性能</text><text x="910.0" y="422" text-anchor="middle" font-size="16" fill="#4e6659">全节点NetworkX对照</text><text x="910.0" y="445" text-anchor="middle" font-size="16" fill="#4e6659">原始计时、预算与重复</text><rect x="405" y="365" width="290" height="135" rx="12" fill="white" stroke="#bacfc1"/><text x="5