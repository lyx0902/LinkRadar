seed: 42
start_method: spawn
datasets:
  - {id: ca_grqc}
  - {id: facebook}
benchmark:
  modes: [serial, static_batches, dynamic_batches]
  processes: [1, 2, 4]
  batch_sizes: [128]
  repeats: 3
  warmups: 0
  source_order: ascending
  task_logging: false
  max_processes: 4
  max_case_seconds: 600
  max_total_seconds: 1800
validation: {enabled: true, max_reference_nodes: 6000, atol: 1.0e-8, rtol: 1.0e-7}
robustness:
  enabled: true
  fractions: [0, .01, .02, .05, .10, .15, .20]
  strategies: [bc, degree, random]
  random_repeats: 20
output: {root: results}
