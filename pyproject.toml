[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkradar"
version = "0.1.0"
description = "Exact Brandes centrality and reproducible spawn multiprocessing experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "networkx>=3.2", "pandas>=2.1", "matplotlib>=3.8", "PyYAML>=6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "psutil>=5.9"]
compiled = ["numba>=0.68,<0.69"]

[project.scripts]
linkradar = "parallel_bc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


[tool.setuptools.package-data]
parallel_bc = ["profiles/*.yaml"]
